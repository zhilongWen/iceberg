plugins {
    id 'java'
    id 'application'
}

group = 'org.apache.iceberg'
version = '1.7.0-SNAPSHOT'

repositories {
    mavenCentral()
}

String scalaVersion = System.getProperty("scalaVersion") != null ? System.getProperty("scalaVersion") : System.getProperty("defaultScalaVersion")

dependencies {
    // Iceberg dependencies
    implementation project(':iceberg-api')
    implementation project(':iceberg-common')
    implementation project(':iceberg-core')
    implementation project(':iceberg-data')
    implementation project(':iceberg-parquet')
    implementation project(':iceberg-orc')
    implementation project(':iceberg-flink:iceberg-flink-1.17')

    // Flink 1.17 dependencies
    implementation libs.flink117.streaming.java
    implementation libs.flink117.runtime
    implementation "org.apache.flink:flink-clients:${libs.versions.flink117.get()}"
    implementation libs.flink117.table.api.java.bridge
    implementation "org.apache.flink:flink-table-planner_${scalaVersion}:${libs.versions.flink117.get()}"
    implementation libs.flink117.connector.files
    implementation libs.flink117.metrics.dropwizard

    // Hadoop dependencies for file system
    implementation libs.hadoop2.common
    implementation libs.hadoop2.hdfs
    implementation libs.hadoop2.mapreduce.client.core

    // Logging
    compileOnly libs.slf4j.api

    // Test dependencies
    testImplementation platform("org.junit:junit-bom:5.10.0")
    testImplementation "org.junit.jupiter:junit-jupiter"
}

tasks.test {
    useJUnitPlatform()
}

// Set Java version
java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

// Configure application plugin
application {
    mainClass = 'org.apache.iceberg.local.Main'
}