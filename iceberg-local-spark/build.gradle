plugins {
    id 'java'
    id 'scala'
    id 'application'
}

group = 'org.apache.iceberg'
version = '1.7.0-SNAPSHOT'

repositories {
    mavenCentral()
}

String scalaVersion = System.getProperty("scalaVersion") != null ? System.getProperty("scalaVersion") : System.getProperty("defaultScalaVersion")
String sparkVersion = libs.versions.spark.hive34.get()

sourceSets {
    main {
        scala.srcDirs = ['src/main/scala', 'src/main/java']
        java.srcDirs = []
    }
}

dependencies {
    // Scala
    implementation "org.scala-lang:scala-library:2.12.17"
    implementation "org.scala-lang.modules:scala-collection-compat_${scalaVersion}:${libs.versions.scala.collection.compat.get()}"

    // Iceberg dependencies
    implementation project(':iceberg-api')
    implementation project(':iceberg-common')
    implementation project(':iceberg-core')
    implementation project(':iceberg-data')
    implementation project(':iceberg-parquet')
    implementation project(':iceberg-orc')
    implementation project(':iceberg-hive-metastore')
    implementation project(":iceberg-spark:iceberg-spark-3.4_${scalaVersion}")
    implementation project(":iceberg-spark:iceberg-spark-extensions-3.4_${scalaVersion}")

    // Spark 3.4 dependencies
    implementation("org.apache.spark:spark-core_${scalaVersion}:${sparkVersion}") {
        exclude group: 'org.apache.avro', module: 'avro'
        exclude group: 'org.apache.arrow'
        exclude group: 'org.apache.parquet'
    }
    implementation("org.apache.spark:spark-sql_${scalaVersion}:${sparkVersion}") {
        exclude group: 'org.apache.avro', module: 'avro'
        exclude group: 'org.apache.arrow'
        exclude group: 'org.apache.parquet'
    }
    implementation("org.apache.spark:spark-hive_${scalaVersion}:${sparkVersion}") {
        exclude group: 'org.apache.avro', module: 'avro'
        exclude group: 'org.apache.arrow'
        exclude group: 'org.apache.parquet'
    }

    // Hadoop dependencies
    implementation libs.hadoop2.common
    implementation libs.hadoop2.hdfs
    implementation libs.hadoop2.mapreduce.client.core

    // Avro for reading Avro files
    implementation libs.avro.avro

    // Logging
    compileOnly libs.slf4j.api

    // Test dependencies
    testImplementation platform("org.junit:junit-bom:5.10.0")
    testImplementation "org.junit.jupiter:junit-jupiter"
}

tasks.test {
    useJUnitPlatform()
}

// Set Java and Scala versions
java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

// Configure application plugin
application {
    mainClass = 'org.apache.iceberg.local.Main'
}

// Configure Scala compilation
tasks.withType(ScalaCompile) {
    scalaCompileOptions.additionalParameters = [
        "-target:jvm-1.8",
        "-deprecation",
        "-feature"
    ]
}

// Task to run ReadAvroFileSuite
tasks.register('runReadAvro', JavaExec) {
    group = 'application'
    description = 'Run ReadAvroFileSuite to read Avro metadata file'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.apache.iceberg.local.ReadAvroFileSuite'
}

// Task to run IcebergCompactionSuite
tasks.register('runCompaction', JavaExec) {
    group = 'application'
    description = 'Run IcebergCompactionSuite to perform table compaction'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.apache.iceberg.local.IcebergCompactionSuite'
}

// Task to run SparkIcebergWriteFile
tasks.register('runWriteFile', JavaExec) {
    group = 'application'
    description = 'Run SparkIcebergWriteFile to write data to Iceberg table'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.apache.iceberg.local.SparkIcebergWriteFile'
}

// Task to run SparkWriteSuite
tasks.register('runWriteSuite', JavaExec) {
    group = 'application'
    description = 'Run SparkWriteSuite to test table existence check'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.apache.iceberg.local.SparkWriteSuite'
}

// Task to run SparkWriteWithPartitionSuite
tasks.register('runWritePartition', JavaExec) {
    group = 'application'
    description = 'Run SparkWriteWithPartitionSuite to test partitioned table'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.apache.iceberg.local.SparkWriteWithPartitionSuite'
}

// Task to run SparkWriteWithPartitionBucketSuite
tasks.register('runWritePartitionBucket', JavaExec) {
    group = 'application'
    description = 'Run SparkWriteWithPartitionBucketSuite to create partition + bucket table'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.apache.iceberg.local.SparkWriteWithPartitionBucketSuite'
}

// Task to run SparkWriteOrCreateSuite
tasks.register('runWriteOrCreate', JavaExec) {
    group = 'application'
    description = 'Run SparkWriteOrCreateSuite - insert if exists, create if not'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.apache.iceberg.local.SparkWriteOrCreateSuite'
}

// Task to run SparkWriteWithPartitionPrimaryKeySuite
tasks.register('runWritePrimaryKey', JavaExec) {
    group = 'application'
    description = 'Run SparkWriteWithPartitionPrimaryKeySuite - MERGE INTO for primary key uniqueness'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.apache.iceberg.local.SparkWriteWithPartitionPrimaryKeySuite'
}